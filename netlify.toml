[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["views/**", "database.sqlite", "models/**", "config/**", "controllers/**", "middlewares/**", "routes/**", "public/**"]

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
